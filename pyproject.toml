[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "macroeconomia"
version = "0.1.0"
description = "Scripts e pipelines Python para análise macroeconômica (coleta, ETL, modelagem, visualização)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "macroeconomia contributors" }]
keywords = ["macroeconomics", "time-series", "bcb", "forecasting", "mlops"]
dependencies = [
    "duckdb>=1.1.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "matplotlib>=3.8.0",
    "mlflow>=2.16.0",
    "numpy>=1.26.0",
    "optuna>=3.6.0",
    "pandas>=2.2.0",
    "pandera[polars]>=0.20.0",
    "plotly>=5.24.0",
    "kaleido>=0.2.1",
    "polars>=1.12.0",
    "prefect>=3.0.0",
    "pyarrow>=17.0.0",
    "pydantic-settings>=2.6.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.8.0",
    "mypy>=1.11.0",
    "pandas-stubs>=2.2.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "streamlit>=1.40.0",
    "types-requests>=2.32.0",
]
volatility = ["arch>=7.0.0"]
panel = ["linearmodels>=6.0"]
bayesian = ["numpyro>=0.15.0", "jax>=0.4.0"]
arima-auto = ["pmdarima>=2.0.0"]
data-sources = ["pandas-datareader>=0.10.0", "fredapi>=0.5.2", "wbdata>=1.0.0"]
ml = ["scikit-learn>=1.5.0", "xgboost>=2.1.0"]
monitoring = ["evidently>=0.4.0"]
serving = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "bentoml>=1.3.0"]
dashboard = ["streamlit>=1.40.0"]
all = [
    "streamlit>=1.40.0",
    "arch>=7.0.0",
    "linearmodels>=6.0",
    "numpyro>=0.15.0",
    "jax>=0.4.0",
    "pmdarima>=2.0.0",
    "pandas-datareader>=0.10.0",
    "fredapi>=0.5.2",
    "wbdata>=1.0.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "evidently>=0.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "bentoml>=1.3.0",
]

[project.scripts]
macro-var-example = "macroeconomia.examples.var_inflation_pipeline:main"
macro-arima-example = "macroeconomia.examples.arima_ipca_pipeline:main"

[dependency-groups]
dev = [
    "black>=24.8.0",
    "mypy>=1.11.0",
    "pandas-stubs>=2.2.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "streamlit>=1.40.0",
    "types-requests>=2.32.0",
]
analytics = [
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "pipelines", "dashboard", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"pipelines/**/*.py" = ["TID252"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["macroeconomia"]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "macroeconomia.models.time_series.var_mlflow_pyfunc"
disable_error_code = ["name-defined", "misc", "no-untyped-call", "arg-type"]

[[tool.mypy.overrides]]
module = "macroeconomia.models.time_series.arima_mlflow_pyfunc"
disable_error_code = ["name-defined", "misc", "no-untyped-call", "arg-type"]

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "statsmodels.*",
    "arch.*",
    "linearmodels.*",
    "mlflow.*",
    "prefect.*",
    "evidently.*",
    "bentoml.*",
    "pandas_datareader.*",
    "fredapi.*",
    "wbdata.*",
    "pmdarima.*",
    "numpyro.*",
    "jax.*",
    "plotly.*",
    "streamlit.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=macroeconomia --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["macroeconomia"]
omit = ["*/examples/*", "*/gaussian_mean_numpyro.py"]
